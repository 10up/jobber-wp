name: WordPress Plugin Checks

on:
  push:
    branches:
      - develop
      - trunk
  pull_request:
    branches:
      - develop

jobs:
  build:
    uses: 10up/jobber-wp/.github/workflows/build-release-zip.yml@develop

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download built zip
        uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765 # v4.2.0
        with:
          name: jobber
          path: jobber

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: jobber

      - name: Run plugin check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: jobber
          exclude-directories: 'assets,dist,vendor,tests'
          ignore-warnings: true
